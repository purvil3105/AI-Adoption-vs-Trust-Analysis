# Answer-label recodes, applied by src/harmonise.py.
# Every raw label must appear here (or the pipeline stops with an "unmapped label" error).
# Curly apostrophes (’) are normalised to straight ones (') BEFORE lookup.
# Keys under a variable are either a year (2023/2024/2025) or "all" (applies to every year).
# A value of null means "treat as missing".

ai_use_status:
  all:
    "Yes": "Yes"
    "No, but I plan to soon": "Plan to"
    "No, and I don't plan to": "No"
    "Yes, I use AI tools daily": "Yes"
    "Yes, I use AI tools weekly": "Yes"
    "Yes, I use AI tools monthly or infrequently": "Yes"

ai_use_frequency:          # 2025 only
  2025:
    "Yes, I use AI tools daily": "Daily"
    "Yes, I use AI tools weekly": "Weekly"
    "Yes, I use AI tools monthly or infrequently": "Monthly or less"
    "No, but I plan to soon": "Not using"
    "No, and I don't plan to": "Not using"

ai_trust:                   # ordered 1 (highly distrust) .. 5 (highly trust)
  all:
    "Highly distrust": "1 Highly distrust"
    "Somewhat distrust": "2 Somewhat distrust"
    "Neither trust nor distrust": "3 Neither"
    "Somewhat trust": "4 Somewhat trust"
    "Highly trust": "5 Highly trust"

ai_sentiment:
  all:
    "Very unfavorable": "1 Very unfavorable"
    "Unfavorable": "2 Unfavorable"
    "Indifferent": "3 Indifferent"
    "Favorable": "4 Favorable"
    "Very favorable": "5 Very favorable"
    "Unsure": "Unsure"

ai_complex:
  all:
    "Very poor at handling complex tasks": "1 Very poor"
    "Bad at handling complex tasks": "2 Bad"
    "Neither good or bad at handling complex tasks": "3 Neither"
    "Good, but not great at handling complex tasks": "4 Good, not great"
    "Very well at handling complex tasks": "5 Very well"
    "I don't use AI tools for complex tasks / I don't know": "Don't use for complex / don't know"

ai_threat:
  all:
    "Yes": "Yes"
    "No": "No"
    "I'm not sure": "Not sure"

ai_agents:                  # 2025 only
  2025:
    "Yes, I use AI agents at work daily": "Uses agents"
    "Yes, I use AI agents at work weekly": "Uses agents"
    "Yes, I use AI agents at work monthly or infrequently": "Uses agents"
    "No, I use AI exclusively in copilot/autocomplete mode": "Copilot/autocomplete only"
    "No, but I plan to": "No agents"
    "No, and I don't plan to": "No agents"

